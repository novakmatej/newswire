# Sources - list order is the digest order. Flip enabled: to switch one off.
# notify: lists the channels a source posts to. Omit it to post to every
# enabled notifier (new channels then join automatically); an explicit list
# pins exactly those ids.
# Source ids are state keys:
# do not rename them, or the renamed source re-notifies from scratch.

- id: dbt-cloud-releases
  type: dbt_cloud_release_notes
  enabled: true
  notify: [slack, teams]
  title: "dbt Cloud Release Notes"
  emoji: "☁️"
  options:
    url: https://docs.getdbt.com/docs/dbt-versions/release-notes/cloud

- id: dbt-core-releases
  type: github_releases
  enabled: true
  notify: [slack, teams]
  title: "dbt-core"
  emoji: "🚀"
  options:
    repo: dbt-labs/dbt-core
    token: ${GITHUB_TOKEN}

# Disabled 2026-09-15: dbt-labs turned Discussions off on dbt-labs/dbt-fusion
# (`has_discussions: false`), so this source can only fail. Re-enable, or point
# `repo`/`category` at wherever Fusion announcements land, once that is known.
- id: dbt-fusion-discussions
  type: github_discussions
  enabled: false
  notify: [slack, teams]
  title: "Fusion Discussions"
  emoji: "💬"
  options:
    repo: dbt-labs/dbt-fusion
    category: announcements
    token: ${GITHUB_TOKEN}

