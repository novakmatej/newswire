# Release-notes generation (anchore/chronicle). Entries come from merged PRs
# and closed issues between two tags, grouped by label. A PR with no label
# falls back to its conventional-commit title prefix (feat:, fix:, perf:, !).
# A PR with neither produces NO changelog entry - see docs/releasing.md.

# We ship >= 1.0.0: breaking changes bump major, not minor.
enforce-v0: false

github:
  host: github.com
  include-prs: true
  include-issues: true
  include-issue-pr-authors: true
  # Fall back to feat:/fix:/perf:/"!" PR-title prefixes when no label is set.
  infer-change-type-from-title: true
  exclude-labels:
    - duplicate
    - question
    - invalid
    - wontfix
    - changelog-ignore
    - ignore
  # Label -> changelog section -> semver bump. Written out explicitly (these
  # mirror chronicle's defaults) so contributors can see which label to use.
  changes:
    - name: breaking-feature
      title: Breaking Changes
      semver-field: major
      labels: [breaking, breaking-change, breaking-feature, backwards-incompatible, major]
    - name: removed-feature
      title: Removed Features
      semver-field: major
      labels: [removed]
    - name: added-feature
      title: Added Features
      semver-field: minor
      labels: [enhancement, feature, minor]
    - name: deprecated-feature
      title: Deprecated Features
      semver-field: minor
      labels: [deprecated]
    - name: bug-fix
      title: Bug Fixes
      semver-field: patch
      labels: [bug, fix, bug-fix, patch]
    # Not a chronicle default. Title inference only covers feat:/fix:/perf:/"!",
    # so docs: and chore: PRs need one of these labels to appear at all.
    - name: documentation
      title: Documentation
      semver-field: patch
      labels: [documentation, docs, chore, maintenance]
    - name: security-fixes
      title: Security Fixes
      semver-field: patch
      labels: [security, vulnerability]
